<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>港股 / 美股手续费计算器</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f6f8fa;
        }

        .calc-card {
            max-width: 760px;
        }

        .market-btn.active {
            color: #fff;
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .fee-row td {
            padding: .35rem .5rem;
        }

        .fee-total {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .rate-input {
            max-width: 140px;
        }

        .free-badge {
            background-color: #198754;
        }
    </style>
</head>

<body class="p-3 p-md-4">
    <div class="calc-card mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">
                    <i class="bi bi-calculator"></i>
                    港股 / 美股手续费计算器
                    <span class="badge free-badge align-middle">免佣金</span>
                </h4>
                <small class="text-muted">计算平台费与代收费（佣金全免）</small>
            </div>
            <div class="card-body">
                <!-- Market selector -->
                <div class="btn-group w-100 mb-3" role="group" aria-label="市场选择">
                    <button type="button" class="btn btn-outline-primary market-btn active" data-market="hk">
                        <i class="bi bi-bank"></i> 港股 (HKD)
                    </button>
                    <button type="button" class="btn btn-outline-primary market-btn" data-market="us">
                        <i class="bi bi-flag"></i> 美股 (USD)
                    </button>
                </div>

                <!-- Trade direction -->
                <div class="btn-group w-100 mb-3" role="group" aria-label="买卖方向">
                    <input type="radio" class="btn-check" name="side" id="sideBuy" value="buy" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-success" for="sideBuy">买入</label>
                    <input type="radio" class="btn-check" name="side" id="sideSell" value="sell" autocomplete="off">
                    <label class="btn btn-outline-danger" for="sideSell">卖出</label>
                </div>

                <!-- Inputs -->
                <div class="row g-3 mb-2">
                    <div class="col-6">
                        <label for="price" class="form-label">成交价格 (<span class="cur-symbol">HK$</span>)</label>
                        <input type="number" class="form-control" id="price" min="0" step="0.001" value="100">
                    </div>
                    <div class="col-6">
                        <label for="qty" class="form-label">数量 (股)</label>
                        <input type="number" class="form-control" id="qty" min="0" step="1" value="1000">
                    </div>
                </div>

                <!-- Advanced rate settings -->
                <div class="mb-3">
                    <button class="btn btn-link btn-sm px-0 text-decoration-none" type="button" data-bs-toggle="collapse"
                        data-bs-target="#rateSettings">
                        <i class="bi bi-gear"></i> 费率设置（可按券商调整）
                    </button>
                    <div class="collapse" id="rateSettings">
                        <div class="border rounded p-3 mt-1 bg-light" id="ratePanel"></div>
                        <button class="btn btn-outline-secondary btn-sm mt-2" type="button" id="resetRates">
                            <i class="bi bi-arrow-counterclockwise"></i> 恢复默认费率
                        </button>
                    </div>
                </div>

                <!-- Result -->
                <h5 class="mt-4">费用明细</h5>
                <table class="table table-sm mb-2">
                    <tbody id="resultBody"></tbody>
                </table>

                <div class="d-flex justify-content-between align-items-center border-top pt-3">
                    <span>预估总费用</span>
                    <span class="fee-total text-primary"><span class="cur-symbol">HK$</span> <span
                            id="totalFee">0.00</span></span>
                </div>
                <div class="d-flex justify-content-between align-items-center text-muted mt-1">
                    <span>成交金额</span>
                    <span><span class="cur-symbol">HK$</span> <span id="turnover">0.00</span></span>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-1">
                    <span class="fw-semibold" id="netLabel">买入总成本</span>
                    <span class="fw-semibold"><span class="cur-symbol">HK$</span> <span id="netAmount">0.00</span></span>
                </div>

                <p class="text-muted small mt-3 mb-0">
                    说明：佣金全免；平台费由券商收取，代收费为政府、交易所及监管机构等第三方费用。各项费率会随政策调整，请以券商最新公告为准。
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
        crossorigin="anonymous"></script>
    <script src="js/stock_fee_calculator.js"></script>
</body>

</html>
